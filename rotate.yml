name: rotate

on:
  # время в UTC. Бали = UTC+8
  # 09:00 / 13:00 / 20:30 по Бали
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python rotate.py

      - name: save state
        run: |
          git config user.name "rotation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json villas.json
          git diff --staged --quiet && exit 0
          git commit -m "rotate"
          git pull --rebase --autostash
          git push
